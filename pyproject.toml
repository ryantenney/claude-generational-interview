[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "generational-interview"
version = "0.1.0"
description = "Harness for staged conversations between two Claude model generations, with a third-model classifier, metrics and a written report."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "PyYAML>=6.0",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
genint = "genint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
